---
- name: Setup doco-cd docker compose project
  hosts: nuc

  tasks:
    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "../../doco-cd/jameson/"
        dest: "./doco-cd/"
        mode: "0644"

    - name: Create and start services
      community.docker.docker_compose_v2:
        project_src: doco-cd
