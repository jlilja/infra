services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.07.2@sha256:8bafd2fed06b05dbd98a75c66f796b8b192b175e8bbecef2d940d95b0aa54a1b
    hostname: pihole01
    ports:
      - "192.168.10.11:53:53/tcp"
      - "192.168.10.11:53:53/udp"
    networks:
      - proxy
      - unbound
    environment:
      TZ: 'Europe/Stockholm'
      
      WEBPASSWORD_FILE: /run/secrets/pihole_webpasswd

      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: unbound
    volumes:
      - './pihole.toml:/etc/pihole/pihole.toml'
    cap_add:
      - NET_ADMIN
    secrets:
      - pihole_webpasswd
    restart: unless-stopped

  unbound:
    image: klutchell/unbound:1.26.0@sha256:5020cfe1218aeda38777f88279220162e602c3a44efc684550dbf46137106a16
    networks:
      - unbound
    # healthcheck:
    #   # Use the drill wrapper binary to reduce the exit codes to 0 or 1 for healthchecks
    #   test: ['CMD', 'drill-hc', '@127.0.0.1', 'dnssec.works']
    #   interval: 30s
    #   timeout: 30s
    #   retries: 3
    #   start_period: 30s
    # volumes:
    #   - /path/to/config:/etc/unbound/custom.conf.d
    restart: unless-stopped

secrets:
  pihole_webpasswd:
    environment: PIHOLE_PASSWORD

networks:
  proxy:
    name: proxy
  unbound:
    name: unbound
