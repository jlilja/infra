services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
    hostname: pihole01
    ports:
      - "192.168.86.20:53:53/tcp"
      - "192.168.86.20:53:53/udp"
    networks:
      - proxy
      - unbound
    environment:
      TZ: 'Europe/Stockholm'
      
      WEBPASSWORD_FILE: /run/secrets/pihole_webpasswd

      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: unbound
    volumes:
      - './pihole.toml:/etc/pihole/pihole.toml'
    cap_add:
      - NET_ADMIN
    secrets:
      - pihole_webpasswd
    restart: unless-stopped

  unbound:
    image: klutchell/unbound:v1.26.2@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    networks:
      - unbound
    # volumes:
    #   - /path/to/config:/etc/unbound/custom.conf.d
    restart: unless-stopped

secrets:
  pihole_webpasswd:
    environment: PIHOLE_PASSWORD

networks:
  proxy:
    name: proxy
  unbound:
    name: unbound
