services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    hostname: pihole01
    ports:
      - "192.168.86.20:53:53/tcp"
      - "192.168.86.20:53:53/udp"
    networks:
      - proxy
      - unbound
    environment:
      TZ: 'Europe/Stockholm'
      
      WEBPASSWORD_FILE: /run/secrets/pihole_webpasswd

      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: unbound
    volumes:
      - './pihole.toml:/etc/pihole/pihole.toml'
    cap_add:
      - NET_ADMIN
    secrets:
      - pihole_webpasswd
    restart: unless-stopped

  unbound:
    image: klutchell/unbound:1.26.0@sha256:5020cfe1218aeda38777f88279220162e602c3a44efc684550dbf46137106a16
    networks:
      - unbound
    # volumes:
    #   - /path/to/config:/etc/unbound/custom.conf.d
    restart: unless-stopped

secrets:
  pihole_webpasswd:
    environment: PIHOLE_PASSWORD

networks:
  proxy:
    name: proxy
  unbound:
    name: unbound
